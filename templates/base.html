<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}기숙사 세탁 예약{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <style>
        :root {
            --primary: #3F7BFF;
            --primary-weak: #EAF1FF;
            --primary-dark: #2457D6;
            --success: #17B26A;
            --success-weak: #E8F8F0;
            --danger: #F04438;
            --danger-weak: #FEECEB;
            --warning: #F79009;
            --warning-weak: #FFF4E5;
            --bg: #F5F7FB;
            --surface: #FFFFFF;
            --surface-soft: #F8FAFF;
            --line: #E6EAF2;
            --ink: #172033;
            --muted: #697386;
            --muted-light: #98A2B3;
            --shadow: 0 18px 40px rgba(23, 32, 51, 0.08);
            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-sm: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #E9EEF7;
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100svh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 16% 0%, rgba(63, 123, 255, 0.18), transparent 30%),
                radial-gradient(circle at 90% 12%, rgba(23, 178, 106, 0.10), transparent 28%),
                #E9EEF7;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            overscroll-behavior-y: contain;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a,
        input {
            -webkit-tap-highlight-color: transparent;
        }

        .app-shell {
            position: relative;
            width: 100%;
            max-width: 460px;
            min-height: 100svh;
            margin: 0 auto;
            background: var(--bg);
            box-shadow: 0 0 34px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
            background: rgba(245, 247, 251, 0.90);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(230, 234, 242, 0.85);
        }

        .topbar-row {
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            gap: 8px;
        }

        .topbar-title {
            text-align: center;
            font-size: 17px;
            font-weight: 850;
            letter-spacing: -0.02em;
        }

        .icon-button {
            width: 44px;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-size: 24px;
            font-weight: 800;
            box-shadow: 0 8px 18px rgba(23, 32, 51, 0.06);
        }

        .topbar-spacer {
            display: block;
            width: 44px;
            height: 44px;
        }

        .text-button {
            width: 44px;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 11px;
            font-weight: 850;
            letter-spacing: -0.04em;
            box-shadow: 0 8px 18px rgba(23, 32, 51, 0.06);
        }

        .content {
            flex: 1;
            padding: 22px 18px calc(30px + env(safe-area-inset-bottom));
        }

        .page-head {
            margin-bottom: 18px;
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            padding: 7px 11px;
            border-radius: 999px;
            background: var(--primary-weak);
            color: var(--primary-dark);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        h1 {
            margin: 0;
            font-size: 29px;
            line-height: 1.16;
            letter-spacing: -0.05em;
        }

        .page-desc {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
            letter-spacing: -0.02em;
        }

        .card {
            background: var(--surface);
            border: 1px solid rgba(230, 234, 242, 0.9);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }

        .card-pad {
            padding: 20px;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            min-height: 56px;
            border: 0;
            border-radius: 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 850;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .btn:active {
            transform: scale(0.985);
        }

        .btn-primary {
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--primary), #5A8DFF);
            box-shadow: 0 12px 22px rgba(63, 123, 255, 0.28);
        }

        .btn-success {
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--success), #38C989);
            box-shadow: 0 12px 22px rgba(23, 178, 106, 0.22);
        }

        .btn-danger {
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--danger), #FF6B5F);
            box-shadow: 0 12px 22px rgba(240, 68, 56, 0.22);
        }

        .btn-danger-soft {
            color: #B42318;
            background: var(--danger-weak);
            box-shadow: none;
        }

        .btn-muted {
            color: var(--muted);
            background: #EAEEF5;
            cursor: not-allowed;
        }

        .btn-ghost {
            color: var(--primary-dark);
            background: var(--primary-weak);
            box-shadow: none;
        }

        .field-label {
            display: block;
            margin: 0 0 8px;
            color: var(--ink);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .field {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            outline: none;
            background: var(--surface-soft);
            color: var(--ink);
            font-size: 16px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .field:focus {
            border-color: rgba(63, 123, 255, 0.75);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(63, 123, 255, 0.12);
        }

        .field::placeholder {
            color: var(--muted-light);
        }

        .form-row {
            margin-bottom: 15px;
        }

        .helper {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .alert {
            margin-bottom: 14px;
            padding: 13px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.45;
        }

        .alert-danger {
            color: #B42318;
            background: var(--danger-weak);
            border: 1px solid rgba(240, 68, 56, 0.18);
        }

        .list-card {
            min-height: 76px;
            padding: 15px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--surface);
            border: 1px solid rgba(230, 234, 242, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 24px rgba(23, 32, 51, 0.05);
            transition: transform 0.15s ease;
        }

        .list-card:active {
            transform: scale(0.985);
        }

        .list-icon {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-weak);
            font-size: 22px;
        }

        .list-main {
            min-width: 0;
            flex: 1;
        }

        .list-main strong {
            display: block;
            color: var(--ink);
            font-size: 17px;
            font-weight: 850;
            letter-spacing: -0.03em;
        }

        .list-main small {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.35;
        }

        .chevron {
            color: var(--muted-light);
            font-size: 26px;
            line-height: 1;
            font-weight: 700;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 999px;
            background: #F2F4F7;
            color: var(--muted);
            font-size: 12px;
            font-weight: 850;
            white-space: nowrap;
        }

        .pill-primary {
            color: var(--primary-dark);
            background: var(--primary-weak);
        }

        .pill-success {
            color: #087443;
            background: var(--success-weak);
        }

        .pill-warning {
            color: #B54708;
            background: var(--warning-weak);
        }

        .pill-danger {
            color: #B42318;
            background: var(--danger-weak);
        }

        .section-title {
            margin: 22px 0 11px;
            color: var(--ink);
            font-size: 15px;
            font-weight: 850;
            letter-spacing: -0.02em;
        }

        @media (max-width: 380px) {
            .content {
                padding-left: 14px;
                padding-right: 14px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        {% block topbar %}
        <header class="topbar">
            <div class="topbar-row">
                <div>{% block topbar_left %}<span class="topbar-spacer"></span>{% endblock %}</div>
                <div class="topbar-title">{% block topbar_title %}기숙사 세탁 예약{% endblock %}</div>
                <div>{% block topbar_right %}<span class="topbar-spacer"></span>{% endblock %}</div>
            </div>
        </header>
        {% endblock %}

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
